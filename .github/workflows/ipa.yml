name: Build IPA
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        required: true
        type: string
      branch:
        description: 'Branch to build tweak from'
        required: false
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Download and Validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --quiet --no-verbose -O youtube.ipa
          # Verify file is a valid zip/ipa structurally instead of relying on mime-types
          if ! unzip -tq youtube.ipa > /dev/null 2>&1; then
            echo "::error::Validation failed: The downloaded file is not a valid or intact IPA."
            exit 1
          fi

      - name: Get YouTube Version
        run: |
          # Extract ONLY the Info.plist (huge performance boost)
          unzip -p youtube.ipa "Payload/*.app/Info.plist" > Info.plist
          # Use macOS native plutil for safely parsing the XML property list
          YT_VERSION=$(plutil -extract CFBundleVersion raw Info.plist)
          echo "YT_VERSION=$YT_VERSION" >> $GITHUB_ENV

      - name: Install Dependencies
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install make ldid

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Get Theos commit
        run: |
          echo "THEOS_COMMIT=$(git ls-remote "https://github.com/roothide/theos" HEAD | awk '{print substr($1,1,7)}')" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: YTNoAds-18.6-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS18.6.sdk
          git checkout --quiet
          mv *.sdk "$THEOS/sdks"

      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader && git pull --quiet --force && cd ${{ github.workspace }}
          fi

      - name: Install cyan and tbd
        run: |
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          # Sudo is recommended for writing to /usr/local/bin on macos-latest (M-series runners)
          sudo wget --quiet --no-verbose "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd
          sudo chmod +x /usr/local/bin/tbd

      - name: Checkout YTNoAds
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          path: YTNoAds

      - name: Build YTNoAds
        run: |
          cd YTNoAds
          echo "YTNOADS_VERSION=$(awk '/^Version:/ {print $2}' control)" >> $GITHUB_ENV
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytnoads.deb

      - name: Inject into IPA
        run: |
          cyan -i youtube.ipa -o YTNoAds_${{ env.YT_VERSION }}_v${{ env.YTNOADS_VERSION }}.ipa -uwef ytnoads.deb -n "YouTube" -b com.google.ios.youtube

      - name: Create a Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytnoads-ipa-${{ github.run_number }}
          name: YTNoAds_${{ env.YT_VERSION }}_v${{ env.YTNOADS_VERSION }} (${{ github.run_number }})
          files: YTNoAds_${{ env.YT_VERSION }}_v${{ env.YTNOADS_VERSION }}.ipa
          draft: true
