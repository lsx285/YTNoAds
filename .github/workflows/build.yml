name: Build YTNoAds
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTNoAds
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout YTNoAds
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          path: YTNoAds

      - name: Install dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Get Theos commit
        run: |
          echo "THEOS_COMMIT=$(git ls-remote "https://github.com/roothide/theos" HEAD | awk '{print substr($1,1,7)}')" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: YTNoAds-18.6-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS18.6.sdk
          git checkout --quiet
          mv *.sdk "$THEOS/sdks"

      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader && git pull --quiet --force && cd ${{ github.workspace }}
          fi

      - name: Build YTNoAds
        run: |
          cd YTNoAds
          echo "YTNOADS_VERSION=$(grep '^Version:' control | cut -d ' ' -f2)" >> $GITHUB_ENV
          make clean package DEBUG=0 FINALPACKAGE=1
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mv packages/*.deb ${{ github.workspace }}

      - name: Upload the tweak .deb(s)
        uses: actions/upload-artifact@v4
        with:
          name: YTNoAds v${{ env.YTNOADS_VERSION }}
          path: ${{ github.workspace }}/*.deb
          if-no-files-found: error
          overwrite: true

      - name: Create a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.YTNOADS_VERSION }}
          name: v${{ env.YTNOADS_VERSION }}
          files: |
            dev.lsx.ytnoads_${{ env.YTNOADS_VERSION }}_iphoneos-arm.deb
            dev.lsx.ytnoads_${{ env.YTNOADS_VERSION }}_iphoneos-arm64.deb
            dev.lsx.ytnoads_${{ env.YTNOADS_VERSION }}_iphoneos-arm64e.deb
          draft: true
