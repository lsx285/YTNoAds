name: Build YTNoAds
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTNoAds
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout YTNoAds
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}
          path: YTNoAds

      - name: Install dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Get Theos commit
        run: |
          echo "THEOS_COMMIT=$(git ls-remote "https://github.com/roothide/theos" HEAD | awk '{print substr($1,1,7)}')" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6.1.0
        with:
          path: theos
          key: YTNoAds-26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout --quiet
          mv *.sdk "$THEOS/sdks"

      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader && git pull --quiet --force && cd ${{ github.workspace }}
          fi

      - name: Build YTNoAds
        run: |
          cd YTNoAds
          make clean package DEBUG=0 FINALPACKAGE=1
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Delete previous workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')
          completed_runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100&status=completed" --jq '.workflow_runs[].id')
          if [[ -n "$completed_runs" ]]; then
            while IFS= read -r run_id; do
              [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            done <<< "$completed_runs"
          fi
